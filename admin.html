<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUSVISION · Админ</title>
<link rel="icon" href="logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sb.js"></script>
<style>
:root{--bg:#0a0a14;--glass:rgba(255,255,255,0.08);--glass-border:rgba(255,255,255,0.15);--paper:#f4f2f7;--mut:rgba(244,242,247,.6);--acc:#e81179}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Rubik,sans-serif;background:var(--bg);color:var(--paper);font-weight:300;padding:40px 20px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-weight:900;letter-spacing:.05em;margin-bottom:8px;font-size:2rem}
.sub{color:var(--mut);font-size:.9rem;margin-bottom:36px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px}
.tabs button{
  border:1px solid var(--glass-border);
  background:var(--glass);
  backdrop-filter:blur(10px);
  color:var(--mut);
  border-radius:999px;
  padding:12px 24px;cursor:pointer;
  font:600 .85rem Rubik;
  transition:all 0.3s;
}
.tabs button.on{color:var(--paper);border-color:var(--acc);background:rgba(232,17,121,0.2)}
.card{
  background:var(--glass);
  backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);
  border-radius:24px;
  padding:32px;margin-bottom:24px;
}
.card h3{font-weight:700;margin-bottom:20px;font-size:1.1rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
input,select{
  width:100%;
  background:rgba(0,0,0,0.3);
  border:1px solid var(--glass-border);
  border-radius:14px;
  color:var(--paper);
  padding:14px;
  margin-bottom:14px;
  font:400 .95rem Rubik;
  transition:border-color 0.3s;
}
input:focus{outline:none;border-color:var(--acc)}
.btn{
  border-radius:999px;padding:14px 32px;
  font:700 .9rem Rubik;cursor:pointer;
  border:1px solid var(--paper);
  background:var(--paper);color:var(--bg);
  transition:all 0.3s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.btn.del{background:none;border-color:var(--glass-border);color:var(--mut);padding:8px 18px;font-size:.85rem}
.btn.del:hover{border-color:#e81179;color:#e81179}
.row{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:16px 8px;
  border-bottom:1px solid var(--glass-border);
  font-size:.95rem;
}
.row:last-child{border:0}
.msg{color:var(--acc);font-size:.85rem;margin-top:12px;min-height:20px}
a.back{color:var(--mut);font-size:.85rem}
#lock{text-align:center;padding:100px 20px}
</style>
</head>
<body>
<div class="wrap" id="lock" style="display:none">
  <h1>Доступ закрыт</h1>
  <p class="sub">Админ-панель доступна только подтверждённым администраторам.<br><br>
  <a class="back" href="index.html">← На сайт</a> · 
  <button class="btn" style="margin-top:20px" onclick="location.reload()">Проверить снова</button></p>
</div>
<div class="wrap" id="panel" style="display:none">
  <h1>RUSVISION · АДМИН</h1>
  <div class="sub"><span id="who"></span> · <a class="back" href="index.html">← На сайт</a> · <a class="back" href="#" id="logout">Выйти</a></div>
  <div class="tabs">
    <button data-t="news" class="on">Новости</button>
    <button data-t="part">Исполнители</button>
    <button data-t="set">Реквизиты</button>
    <button data-t="soc">Соцсети</button>
    <button data-t="admins">Администраторы</button>
  </div>

  <div id="t-news">
    <div class="card"><h3>Добавить новость</h3>
      <div class="grid">
        <input id="n_region" placeholder="Регион">
        <input id="n_code" placeholder="Код (ТАТ)">
      </div>
      <input id="n_title" placeholder="Заголовок">
      <input id="n_excerpt" placeholder="Краткое описание">
      <input id="n_image" placeholder="URL изображения (https://...)">
      <select id="n_accent"><option value="1">Акцент 1</option><option value="2">Акцент 2</option><option value="3">Акцент 3</option><option value="4">Акцент 4</option><option value="5">Акцент 5</option><option value="0">Акцент 6</option></select>
      <button class="btn" onclick="addNews()">Опубликовать</button><div class="msg" id="m-news"></div>
    </div>
    <div class="card"><h3>Опубликованные</h3><div id="list-news"></div></div>
  </div>

  <div id="t-part" style="display:none">
    <div class="card"><h3>Добавить исполнителя</h3>
      <div class="grid">
        <input id="p_artist" placeholder="Исполнитель">
        <input id="p_region" placeholder="Регион">
      </div>
      <input id="p_code" placeholder="Код">
      <input id="p_image" placeholder="URL фото исполнителя (https://...)">
      <button class="btn" onclick="addPart()">Добавить</button><div class="msg" id="m-part"></div>
    </div>
    <div class="card"><h3>Список</h3><div id="list-part"></div></div>
  </div>

  <div id="t-set" style="display:none">
    <div class="card"><h3>Реквизиты сайта</h3>
      <input id="s_name" placeholder="Название">
      <input id="s_tag" placeholder="Слоган">
      <input id="s_note" placeholder="Копирайт">
      <input id="s_email" placeholder="E-mail">
      <button class="btn" onclick="saveSet()">Сохранить</button><div class="msg" id="m-set"></div>
    </div>
  </div>

  <div id="t-soc" style="display:none">
    <div class="card"><h3>Добавить соцсеть</h3>
      <div class="grid">
        <input id="so_title" placeholder="Название">
        <input id="so_icon" placeholder="Эмодзи (✈️)">
      </div>
      <input id="so_url" placeholder="https://...">
      <button class="btn" onclick="addSoc()">Добавить</button><div class="msg" id="m-soc"></div>
    </div>
    <div class="card"><h3>Текущие ссылки</h3><div id="list-soc"></div></div>
  </div>

  <div id="t-admins" style="display:none">
    <div class="card"><h3>Добавить администратора</h3>
      <input id="a_email" placeholder="E-mail нового админа">
      <button class="btn" onclick="addAdmin()">Добавить</button><div class="msg" id="m-admins"></div>
    </div>
    <div class="card"><h3>Текущие администраторы</h3><div id="list-admins"></div></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  ['news','part','set','soc','admins'].forEach(t => $('t-'+t).style.display = t === b.dataset.t ? '' : 'none');
});
$('logout').onclick = async e => { e.preventDefault(); if(window.rv_supabase) await window.rv_supabase.auth.signOut(); location.href = 'index.html'; };

async function boot() {
  const client = window.rv_supabase;
  if (!client) { $('lock').style.display = ''; return; }
  try {
    const { data: { session } } = await client.auth.getSession();
    if (!session || !(await isAdmin())) { $('lock').style.display = ''; return; }
    $('who').textContent = session.user.email;
    $('panel').style.display = '';
    refreshAll();
  } catch (e) { console.error(e); $('lock').style.display = ''; }
}

async function refreshAll() {

  const client = window.rv_supabase;
  if (!client) return;
  try {
    const n = await client.from('news').select('*').order('created_at', { ascending: false });
    $('list-news').innerHTML = (n.data||[]).map(x => `<div class="row"><span><b>${x.code}</b> · ${x.region} — ${x.title}</span><button class="btn del" onclick="del('news',${x.id})">Удалить</button></div>`).join('') || '<p style="color:var(--mut);text-align:center;padding:20px">Нет новостей</p>';
    
    const p = await client.from('participants').select('*').order('sort');
    $('list-part').innerHTML = (p.data||[]).map(x => `<div class="row"><span><b>${x.code}</b> · ${x.artist} — ${x.region}</span><button class="btn del" onclick="del('participants',${x.id})">Удалить</button></div>`).join('') || '<p style="color:var(--mut);text-align:center;padding:20px">Нет участников</p>';
    
    const s = await client.from('site_settings').select('*').eq('id',1).single();
    if (s.data) { $('s_name').value = s.data.site_name||''; $('s_tag').value = s.data.tagline||''; $('s_note').value = s.data.footer_note||''; $('s_email').value = s.data.contact_email||''; }
    
    const so = await client.from('social_links').select('*').order('sort');
    $('list-soc').innerHTML = (so.data||[]).map(x => `<div class="row"><span>${x.icon} ${x.title} — ${x.url}</span><button class="btn del" onclick="del('social_links',${x.id})">Удалить</button></div>`).join('') || '<p style="color:var(--mut);text-align:center;padding:20px">Нет ссылок</p>';

    const a = await client.from('admins').select('email');
    $('list-admins').innerHTML = (a.data||[]).map(x => `<div class="row"><span>👤 ${x.email}</span><button class="btn del" onclick="removeAdmin('${x.email}')">Удалить</button></div>`).join('') || '<p style="color:var(--mut);text-align:center;padding:20px">Нет администраторов</p>';
    
    const a = await client.from('admins').select('email');
    $('list-admins').innerHTML = (a.data||[]).map(x => {
    const isMain = x.email === 'shkiphunt@gmail.com';
    return `<div class="row"><span>👤 ${x.email} ${isMain ? '<span style="color:var(--acc);font-size:.75rem">(главный)</span>' : ''}</span>
    ${isMain ? '<span style="color:var(--mut);font-size:.8rem">защищён</span>' : `<button class="btn del" onclick="removeAdmin('${x.email}')">Удалить</button>`}</div>`;
    }).join('') || '<p style="color:var(--mut);text-align:center;padding:20px">Нет администраторов</p>';
  } catch (e) { console.error(e); }
  
}

async function del(table, id) {
  await window.rv_supabase.from(table).delete().eq('id', id);
  refreshAll();
}

async function addNews() {
  const { error } = await window.rv_supabase.from('news').insert({
    region: $('n_region').value, code: $('n_code').value,
    title: $('n_title').value, excerpt: $('n_excerpt').value,
    image_url: $('n_image').value, accent: +$('n_accent').value
  });
  $('m-news').textContent = error ? '❌ ' + error.message : '✅ Готово';
  if (!error) { ['n_region','n_code','n_title','n_excerpt','n_image'].forEach(i => $(i).value = ''); refreshAll(); }
}

async function addPart() {
  const { error } = await window.rv_supabase.from('participants').insert({
    artist: $('p_artist').value, region: $('p_region').value,
    code: $('p_code').value, image_url: $('p_image').value, sort: Date.now() % 100000
  });
  $('m-part').textContent = error ? '❌ ' + error.message : '✅ Готово';
  if (!error) { ['p_artist','p_region','p_code','p_image'].forEach(i => $(i).value = ''); refreshAll(); }
}

async function addSoc() {
  const { error } = await window.rv_supabase.from('social_links').insert({
    title: $('so_title').value, url: $('so_url').value,
    icon: $('so_icon').value || '🔗', sort: Date.now() % 100000
  });
  $('m-soc').textContent = error ? '❌ ' + error.message : '✅ Готово';
  if (!error) { ['so_title','so_url','so_icon'].forEach(i => $(i).value = ''); refreshAll(); }
}

async function saveSet() {
  const { error } = await window.rv_supabase.from('site_settings').update({
    site_name: $('s_name').value, tagline: $('s_tag').value,
    footer_note: $('s_note').value, contact_email: $('s_email').value
  }).eq('id', 1);
  $('m-set').textContent = error ? '❌ ' + error.message : '✅ Сохранено';
}

async function addAdmin() {
  const email = $('a_email').value;
  if (!email) { $('m-admins').textContent = '❌ Введите email'; return; }
  const { error } = await window.rv_supabase.rpc('add_admin', { email });
  $('m-admins').textContent = error ? '❌ ' + error.message : '✅ Админ добавлен';
  if (!error) { $('a_email').value = ''; refreshAll(); }
}

async function removeAdmin(email) {
  // Защита главного админа на уровне JS
  if (email === 'shkiphunt@gmail.com') {
    alert('❌ Нельзя удалить Шкипера из списка админов!');
    return;
  }
  if (!confirm('Удалить администратора ' + email + '?')) return;
  const { error } = await window.rv_supabase.rpc('remove_admin', { email });
  if (error) alert('❌ ' + error.message);
  else refreshAll();
}

boot();
</script>
</body>
</html>
