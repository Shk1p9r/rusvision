<head>

<title>ROSVISION — Song Contest of the Regions</title>

<style>
:root{--bg:#221b2a;--ink:#0d0a12;--paper:#f4f2f7;--mut:rgba(244,242,247,.55);--line:rgba(244,242,247,.14);--acc:#e81179}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Rubik,sans-serif;background:var(--bg);color:var(--paper);font-weight:300;line-height:1.55}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.lg-ink{stroke:var(--ink)} .lg-ring{stroke:var(--paper)} .lg-text{fill:var(--paper)}
/* HEADER */
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:50}
.nav{display:flex;align-items:center;justify-content:space-between;height:70px;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em}
.brand svg{height:34px}
.menu{display:flex;gap:26px;list-style:none;font-size:.85rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.menu a{color:var(--mut)} .menu a:hover{color:var(--paper)}
.right{display:flex;align-items:center;gap:14px}
/* LANG */
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;color:var(--paper);padding:7px 14px;cursor:pointer;font:500 .8rem Rubik}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);background:#2c2436;border:1px solid var(--line);border-radius:14px;min-width:190px;display:none;overflow:hidden;z-index:60}
.lang-menu.open{display:block}
.lang-menu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--paper);padding:10px 16px;cursor:pointer;font:400 .85rem Rubik;text-align:left}
.lang-menu button:hover{background:rgba(255,255,255,.06)}
.lang-menu svg{border-radius:3px}
/* BUTTONS / AUTH */
.btn{border-radius:999px;padding:11px 24px;font:700 .85rem Rubik;cursor:pointer;border:1px solid var(--paper);background:none;color:var(--paper);transition:.2s}
.btn:hover{background:var(--paper);color:var(--bg)}
.btn-solid{background:var(--paper);color:var(--bg)}
.btn-solid:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.btn-acc{background:var(--acc);border-color:var(--acc);color:#fff}
.user-chip{font-size:.8rem;color:var(--mut)}
/* HERO */
.hero{padding:90px 0 70px;text-align:center}
.hero-logo svg{height:min(46vw,330px);margin:0 auto}
.hero h1{font-size:clamp(1.7rem,4vw,3.2rem);font-weight:800;letter-spacing:-.02em;margin:34px auto 14px;max-width:800px}
.hero p{color:var(--mut);max-width:560px;margin:0 auto 26px}
.hero-dates{font-weight:700;letter-spacing:.3em;font-size:.9rem;color:var(--acc);margin-bottom:30px}
.hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
/* TICKER */
.ticker{border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;padding:12px 0}
.ticker-track{display:flex;gap:44px;width:max-content;animation:scr 32s linear infinite;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);font-weight:500}
.ticker-track em{font-style:normal;color:var(--acc)}
@keyframes scr{to{transform:translateX(-50%)}}
/* SECTIONS */
section{padding:80px 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;border-top:1px solid var(--paper);padding-top:18px;margin-bottom:44px}
.sec-head h2{font-size:clamp(1.4rem,2.6vw,2.1rem);font-weight:800;letter-spacing:-.01em}
.sec-head a{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:700}
/* NEWS (единый шаблон карточки) */
.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.news-card{background:var(--bg);padding:28px;display:flex;flex-direction:column;gap:12px;transition:.25s}
.news-card:hover{background:#2c2436}
.nc-top{display:flex;justify-content:space-between;align-items:center}
.nc-code{font-size:1.7rem;font-weight:900;color:var(--line)}
.nc-dot{width:8px;height:8px;border-radius:50%}
.nc-region{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:700}
.nc-title{font-weight:700;font-size:1.05rem;line-height:1.35}
.nc-ex{color:var(--mut);font-size:.88rem}
/* PARTICIPANTS */
.part-list{border-top:1px solid var(--line)}
.part-row{display:grid;grid-template-columns:70px 1fr auto;padding:18px 6px;border-bottom:1px solid var(--line);align-items:center;transition:.2s}
.part-row:hover{padding-left:16px;background:rgba(255,255,255,.03)}
.pr-code{font-weight:900;color:var(--mut)}
.pr-artist{font-weight:700}
.pr-region{color:var(--mut);font-size:.85rem}
/* ABOUT */
.about p{max-width:680px;color:var(--mut);font-size:1.05rem}
/* FOOTER */
footer{border-top:1px solid var(--line);padding:56px 0 30px}
.f-top{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;margin-bottom:36px}
.f-brand svg{height:70px}
.f-brand b{display:block;font-weight:900;letter-spacing:.05em;margin-top:8px}
.f-brand span{color:var(--mut);font-size:.8rem}
.f-col h4{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
.f-col a,.f-col p{display:block;color:var(--paper);font-size:.9rem;margin-bottom:8px}
.f-col a:hover{color:var(--acc)}
.socials{display:flex;gap:10px}
.socials a{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem}
.socials a:hover{border-color:var(--acc)}
.f-bottom{border-top:1px solid var(--line);padding-top:20px;color:var(--mut);font-size:.78rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
/* MODAL / COOKIES */
.modal{position:fixed;inset:0;background:rgba(10,8,14,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.open{display:flex}
.modal-box{background:#2c2436;border:1px solid var(--line);border-radius:20px;padding:34px;width:100%;max-width:400px}
.modal-box h3{font-weight:800;margin-bottom:20px}
.modal-box input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--paper);padding:13px 16px;margin-bottom:12px;font:400 .9rem Rubik}
.modal-box input:focus{outline:1px solid var(--acc)}
.modal-tabs{display:flex;gap:8px;margin-bottom:20px}
.modal-tabs button{flex:1;border:1px solid var(--line);background:none;color:var(--mut);border-radius:999px;padding:9px;cursor:pointer;font:600 .8rem Rubik}
.modal-tabs button.on{color:var(--paper);border-color:var(--paper)}
.modal-msg{font-size:.8rem;color:var(--acc);min-height:18px;margin-top:8px}
.cookies{position:fixed;left:20px;right:20px;bottom:20px;border:1px solid var(--line);background:#2c2436;border-radius:18px;padding:18px 22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:90}
.cookies p{font-size:.8rem;color:var(--mut);max-width:640px}
@media(max-width:860px){.news-grid{grid-template-columns:1fr}.menu{display:none}.part-row{grid-template-columns:54px 1fr;gap:4px}.pr-region{grid-column:2}}
</style>
</head>

let lang=localStorage.getItem('rv_lang')||'ru';
const t=k=>(I18N[lang]&&I18N[lang][k])||I18N.ru[k]||k;
function applyLang(){document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
 document.getElementById('langBtn').innerHTML=FLAGS[lang]+' '+lang.toUpperCase();
 document.documentElement.lang=lang;}
const langMenu=document.getElementById('langMenu');
langMenu.innerHTML=LANGS.map(([c,n])=>`<button data-l="${c}">${FLAGS[c]} ${n}</button>`).join('');
document.getElementById('langBtn').onclick=e=>{e.stopPropagation();langMenu.classList.toggle('open')};
langMenu.onclick=e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;localStorage.setItem('rv_lang',lang);applyLang();langMenu.classList.remove('open')};
document.addEventListener('click',()=>langMenu.classList.remove('open'));

/* ========== ДАННЫЕ (fallback если Supabase не подключён) ========== */
const ACC=['#e81179','#00b3c4','#f7b733','#6a2bd9','#0e9f6e','#ff7a59'];
const FB={news:[
 {region:'Республика Татарстан',code:'ТАТ',title:'Татарстан готов принять ROSVISION 2026',excerpt:'Площадка прошла финальную проверку и готовится встретить делегации регионов.',accent:1},
 {region:'Свердловская область',code:'СВР',title:'Свердловская область подтвердила участие 2027',excerpt:'Регион официально подал заявку в оргкомитет конкурса.',accent:2},
 {region:'Краснодарский край',code:'КРД',title:'Краснодарский край подал заявку на проведение 2028',excerpt:'Заявка подана по итогам внутреннего отбора региона.',accent:3}],
 part:[{artist:'Йолдыз',region:'Республика Татарстан',code:'ТАТ'},{artist:'Северный Ветер',region:'Ханты-Мансийский АО',code:'ЮGR'},{artist:'Курай',region:'Башкортостан',code:'БШК'},{artist:'Белые Ночи',region:'Ленинградская область',code:'ЛЕН'}],
 set:{site_name:'ROSVISION',tagline:'Song Contest of the Regions of Russia',footer_note:'© 2026 ROSVISION. Все права защищены.',contact_email:'info@rusvision.ru'},
 soc:[{title:'Telegram',url:'https://t.me/',icon:'✈️'},{title:'VK',url:'https://vk.com/',icon:'🔵'}]};

function renderNews(list){document.getElementById('newsGrid').innerHTML=list.map(n=>`
 <article class="news-card"><div class="nc-top"><span class="nc-code">${n.code||'···'}</span><span class="nc-dot" style="background:${ACC[(n.accent||1)%6]}"></span></div>
 <div class="nc-region">${n.region}</div><div class="nc-title">${n.title}</div><div class="nc-ex">${n.excerpt||''}</div></article>`).join('')}
function renderPart(list){document.getElementById('partList').innerHTML=list.map(p=>`
 <div class="part-row"><span class="pr-code">${p.code||'—'}</span><span class="pr-artist">${p.artist}</span><span class="pr-region">${p.region}</span></div>`).join('');
 document.getElementById('ticker').innerHTML=(list.map(p=>`${p.region} <em>★</em>`).join(' ')+' ').repeat(2)}
function renderFoot(s,soc){document.getElementById('fName').textContent=s.site_name;document.getElementById('fTag').textContent=s.tagline;
 document.getElementById('fNote').textContent=s.footer_note;document.getElementById('fEmail').textContent=s.contact_email;
 document.getElementById('fSocials').innerHTML=soc.map(x=>`<a href="${x.url}" title="${x.title}" target="_blank">${x.icon}</a>`).join('')}

async function load(){
 if(!supabase){renderNews(FB.news);renderPart(FB.part);renderFoot(FB.set,FB.soc);return}
 try{
  const [n,p,s,so]=await Promise.all([
   supabase.from('news').select('*').eq('published',true).order('created_at',{ascending:false}),
   supabase.from('participants').select('*').order('sort'),
   supabase.from('site_settings').select('*').eq('id',1).single(),
   supabase.from('social_links').select('*').order('sort')]);
  renderNews(n.data?.length?n.data:FB.news);renderPart(p.data?.length?p.data:FB.part);renderFoot(s.data||FB.set,so.data||FB.soc);
 }catch(e){renderNews(FB.news);renderPart(FB.part);renderFoot(FB.set,FB.soc)}}

/* ========== AUTH ========== */
let mode='login';
const modal=document.getElementById('modal');
function openModal(m){mode=m;modal.classList.add('open');
 document.getElementById('tabLogin').classList.toggle('on',m==='login');
 document.getElementById('tabReg').classList.toggle('on',m==='reg');
 document.getElementById('authSubmit').textContent=m==='login'?t('auth_login'):t('auth_register');
 document.getElementById('authMsg').textContent=''}
function closeModal(){modal.classList.remove('open')}
document.getElementById('authBtn').onclick=()=>openModal('login');
document.getElementById('tabLogin').onclick=()=>openModal('login');
document.getElementById('tabReg').onclick=()=>openModal('reg');
document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();
 const email=document.getElementById('email').value,pass=document.getElementById('pass').value,msg=document.getElementById('authMsg');
 if(!supabase){msg.textContent='Supabase не настроен (sb.js)';return}
 if(mode==='reg'){const {error}=await supabase.auth.signUp({email,password:pass});
  msg.textContent=error?error.message:t('auth_confirm');if(!error)setTimeout(closeModal,2500);}
 else{const {error}=await supabase.auth.signInWithPassword({email,password:pass});
  msg.textContent=error?t('auth_wrong'):t('auth_done');if(!error)setTimeout(closeModal,800);}}
async function refreshAuth(){
 const chip=document.getElementById('userChip'),ab=document.getElementById('adminBtn'),btn=document.getElementById('authBtn');
 if(!supabase){btn.style.display='';btn.textContent=t('auth_login');btn.onclick=()=>openModal('login');return}
 const {data:{session}}=await supabase.auth.getSession();
 if(session){const adm=await isAdmin();
  chip.textContent=session.user.email+' ';
  btn.textContent=t('auth_logout');btn.onclick=async()=>{await supabase.auth.signOut();refreshAuth()};
  ab.style.display=adm?'':'none';
 }else{chip.textContent='';ab.style.display='none';btn.textContent=t('auth_login');btn.onclick=()=>openModal('login')}}
if(supabase)supabase.auth.onAuthStateChange(()=>refreshAuth());

function okCookies(){document.getElementById('cookies').style.display='none'}
if(localStorage.getItem('rv_ck'))document.getElementById('cookies').style.display='none';
else document.getElementById('cookies').querySelector('.btn').onclick=()=>{localStorage.setItem('rv_ck',1);okCookies()};

applyLang();load();refreshAuth();
</script>
